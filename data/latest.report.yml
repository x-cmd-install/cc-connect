ame":"cc-connect-v1.5.4-linux-arm64.tar.gz","label":"","uploader":{"login":"chenhg5","id":4344486,"node_id":"MDQ6VXNlcjQzNDQ0ODY=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":15745732,"digest":"sha256:acb8ae454793955d2bf61e57b23646cebda5ae37abe5498ee5fa3b16d96cba07","download_count":21,"created_at":"2026-11-27T10:41:49Z","updated_at":"2026-11-27T10:41:58Z"},{"id":800074985,"node_id":"RA_kwDORa0x384vsCzp","name":"cc-connect-v1.5.4-windows-amd64.zip","label":"","uploader":{"login":"chenhg5","id":4344486,"node_id":"MDQ6VXNlcjQzNDQ0ODY=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":17570683,"digest":"sha256:9a9ccb8ccc71539b298b10e22eb1f3b2965ab1ddc8c41eb7bea93137601166e0","download_count":167,"created_at":"2026-11-27T10:41:49Z","updated_at":"2026-11-27T10:42:01Z"},{"id":800075525,"node_id":"RA_kwDORa0x384vsC8F","name":"cc-connect-v1.5.4-windows-arm64.zip","label":"","uploader":{"login":"chenhg5","id":4344486,"node_id":"MDQ6VXNlcjQzNDQ0ODY=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":15822675,"digest":"sha256:ecde952949becdb7d4b9ebbaa9880657b23fa94c90ea39ae4d4d9f0e099d2a89","download_count":22,"created_at":"2026-11-27T10:42:00Z","updated_at":"2026-11-27T10:42:03Z"},{"id":800075580,"node_id":"RA_kwDORa0x384vsC88","name":"checksums.txt","label":"","uploader":{"login":"chenhg5","id":4344486,"node_id":"MDQ6VXNlcjQzNDQ0ODY=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":1208,"digest":"sha256:9657a39e23d75ff156b5af2e886632de1aa1b5144e8b1473dda713908e6bf372","download_count":50,"created_at":"2026-11-27T10:42:01Z","updated_at":"2026-11-27T10:42:01Z"}],"body":"## What's Changed\n\nStable release since **v1.5.3**, promoting **v1.5.4-beta.1** (`ba299781`) unchanged. It rolls up **36 merged pull requests** — 10 new features and 25 fixes, plus a CI change — with the bulk of the work on Feishu card handling, provider presets, and Codex and Claude Code session behavior.\n\nUpgrading to v1.5.4 is recommended: every new option is optional with safe defaults.\n\n### How this release was validated\n\n- Unit, regression, performance and blackbox tests in CI on this commit.\n- Release QA (`go test -race`, blackbox smoke) on the exact commit.\n- Live Feishu channel smoke (Claude Code + Codex) on the release binary.\n- Promoted from v1.5.4-beta.1 after its beta period and maintainer approval.\n\n### New Features\n\n- **Feishu:** `attachment_wait = \"mention\"` holds topic attachments until the sender's next @bot (#2316)\n- **DingTalk:** Optional group reply as text + clickable atUserIds (@) via `at_mention_groups` (#1973)\n- **Codex:** The app-server AskUserQuestion timeout is configurable (#2327)\n- **ACP:** The `thought_level` config option is exposed as reasoning effort (#2308)\n- **Providers:** Lazu provider preset (#2329)\n- **Providers:** AIGROW provider preset (#2318)\n- **Providers:** WorldRouter provider preset (#2315)\n- **Providers:** UberLLM provider preset (#2231)\n- **Providers:** TrustedRouter provider preset (#2263)\n- **Providers:** Requesty provider preset (#2262)\n\n### Fixed\n\n**Core and sessions**\n- The /model session restart is deferred until the running turn completes (#2328)\n- Timer exec jobs run through the configured shell (#2326)\n- HTML tags written inside inline code are escaped (#2282)\n- String truncation preserves UTF-8 (#2155)\n\n**Claude Code**\n- The /usage probe reports \"Failed to load usage data\" (#2311)\n- /stop cancels the running turn gracefully and keeps the session alive (#1765)\n\n**Codex**\n- Models are discovered from the configured native CLI (#2287)\n- /ps guidance steers the active turn (#2213)\n\n**Feishu**\n- AskUserQuestion and permission card clicks are accepted only from the requester, and stale clicks are ignored (#2323, #2281)\n- The requester-only card toast is localized (#2321)\n- Interactive group cards that mention the bot are dispatched (#2291)\n- The WebSocket is restarted after the SDK exhausts its reconnect attempts (#2288)\n- The card answer is no longer echoed as a second chat message (#2290)\n- Card control callbacks are never coalesced (#2276)\n\n**Other platforms**\n- **MAX:** Only private-dialog chats are cached for callback routing (#2284)\n- **QQ:** Text replies can be sent over the OneBot HTTP API with the opt-in `send_via_http` option (#2325)\n- **WeCom:** The required task_id is sent on button_interaction cards (#2283)\n\n**Other agents**\n- **Antigravity:** Empty headless runs and process failures are reported (#1980)\n- **Kimi:** `--quiet` is no longer passed alongside stream-json output (#2324)\n- **OpenCode:** The wildcard permission stays next to the skill rules (#2273)\n- **Pi:** The reasoning suffix of a model reference is kept (#2272)\n\n**Daemon, config and install**\n- **Cron:** Shutdown no longer waits for a running job (#2322)\n- **Daemon:** launchd owns the restart transaction (#2286)\n- **Doctor:** The configured `data_dir` is checked instead of ~/.cc-connect (#2320)\n\n### Other Changes\n\n- **CI:** Pushes to release/** branches run CI (#2293)\n\n### Behavior changes worth knowing\n\n- **Claude Code /stop (#1765):** /stop now interrupts the running turn gracefully instead of tearing the session down, so the session stays alive.\n- **Timer exec jobs (#2326):** timer exec jobs now run through the shell you configured.\n- **/model (#2328):** switching the model no longer restarts the session mid-turn; the restart is deferred until the running turn completes.\n- **Feishu group cards (#2291):** interactive cards that mention the bot are now dispatched in group chats.\n- **Feishu reconnect (#2288):** the WebSocket is restarted after the SDK exhausts its reconnect attempts instead of staying disconnected.\n- **Feishu card callbacks (#2276):** card control callbacks are no longer coalesced, so rapid clicks are handled one by one.\n\n### Breaking Changes\n\nNone. All new options are optional with safe defaults.\n\n### Contributors\n\nThanks to the **19 external contributors** who landed 26 changes in this release, and to the cc-connect team. 🎉\n\n@openviking-superagent @qvictl @Niko-Wu @quwang123 @AaronZ345 @al-global-tech @asmoyou @DuaneChen520 @evachxji @guglielmo-io @jperla @molly-lazu @MrLuiqi @Opgeek-1 @Thibaultjaigu @wgx521 @Whyyy00 @xxb @YongmaoLuo\n\n**Full Changelog**: https://github.com/chenhg5/cc-connect/compare/v1.5.3...v1.5.4\n","mentions_count":20}
